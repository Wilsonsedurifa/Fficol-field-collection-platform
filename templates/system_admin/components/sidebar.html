<aside id="sa-sidebar" class="sa-sidebar" aria-label="System Admin navigation">
  <div class="sa-brand">
    <a href="{% url 'system_admin_dashboard' %}" aria-label="FiCol System Admin home">
      <span class="sa-brand-mark" aria-hidden="true">SA</span>
      <span>FiCol<small>System Admin</small></span>
    </a>
  </div>
  <nav class="sa-nav" aria-label="Main navigation">
    <div class="sa-nav-group">Administration</div>
    <a class="sa-nav-item{% if admin_section == 'dashboard' %} is-active{% endif %}" href="{% url 'system_admin_dashboard' %}" {% if admin_section == 'dashboard' %}aria-current="page"{% endif %}>
      <svg class="sa-nav-icon" aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="11" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="11" width="6" height="6" rx="1.5"/><rect x="11" y="11" width="6" height="6" rx="1.5"/></svg>
      <span class="sa-nav-label">Dashboard</span>
    </a>
    <a class="sa-nav-item{% if admin_section == 'users' %} is-active{% endif %}" href="{% url 'system_admin_users' %}" {% if admin_section == 'users' %}aria-current="page"{% endif %}>
      <svg class="sa-nav-icon" aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 17v-1.5a3.5 3.5 0 00-3.5-3.5h-5A3.5 3.5 0 004 15.5V17"/><circle cx="10" cy="7" r="3.5"/></svg>
      <span class="sa-nav-label">Users &amp; Access</span>
    </a>
    <a class="sa-nav-item{% if admin_section == 'clients' %} is-active{% endif %}" href="{% url 'system_admin_clients' %}" {% if admin_section == 'clients' %}aria-current="page"{% endif %}>
      <svg class="sa-nav-icon" aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5L10 3l7 4.5v7a1.5 1.5 0 01-1.5-1.5h-11A1.5 1.5 0 013 14.5v-7z"/><path d="M10 16V10"/><path d="M7 10h6"/></svg>
      <span class="sa-nav-label">Clients</span>
    </a>
    <a class="sa-nav-item{% if admin_section == 'audit' %} is-active{% endif %}" href="{% url 'system_admin_audit' %}" {% if admin_section == 'audit' %}aria-current="page"{% endif %}>
      <svg class="sa-nav-icon" aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V4a2 2 0 00-2-2z"/><path d="M9 11l2 2 4-4"/><line x1="7" y1="7" x2="13" y2="7"/></svg>
      <span class="sa-nav-label">Audit Log</span>
    </a>

    <div class="sa-nav-group">Cross-Portal</div>
    <a class="sa-nav-item" href="{% url 'supervisor_dashboard' %}">
      <svg class="sa-nav-icon" aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2l8 6v9a1 1 0 01-1 1H3a1 1 0 01-1-1V8l8-6z"/></svg>
      <span class="sa-nav-label">Back Office</span>
    </a>

  </nav>
  <div class="sa-sidebar-footer">
    <div class="sa-identity-card">
      <span class="sa-identity-avatar" aria-hidden="true">{{ request.user.first_name|first|default:request.user.username|first|upper }}</span>
      <div class="sa-identity-meta">
        <strong title="{{ request.user.get_full_name|default:request.user.username }}">{{ request.user.get_full_name|default:request.user.username }}</strong>
        <span>System Admin</span>
      </div>
    </div>
  </div>
</aside>
